<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ReFling Logs</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a1a;
      color: #d4d4d4;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Mono', 'Menlo', monospace;
      font-size: 12px;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 12px;
      background: #252525;
      border-bottom: 1px solid #333;
      -webkit-app-region: drag;
    }
    .toolbar-title {
      font-size: 12px;
      font-weight: 600;
      color: #e0e0e0;
    }
    .toolbar-actions {
      display: flex;
      gap: 8px;
      -webkit-app-region: no-drag;
    }
    .clear-btn {
      background: #333;
      color: #d4d4d4;
      border: 1px solid #555;
      padding: 3px 10px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .clear-btn:hover { background: #444; }
    .log-container {
      flex: 1;
      overflow-y: auto;
      padding: 8px 12px;
    }
    .log-entry {
      padding: 2px 0;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-all;
      color: #b0b0b0;
    }
    .log-entry:hover { background: #222; }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #555; }
    .empty-state {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #555;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <span class="toolbar-title">ReFling Logs</span>
    <div class="toolbar-actions">
      <button class="clear-btn" id="clearBtn">Clear</button>
    </div>
  </div>
  <div class="log-container" id="logContainer">
    <div class="empty-state" id="emptyState">No logs yet.</div>
  </div>

  <script>
    const container = document.getElementById('logContainer');
    const emptyState = document.getElementById('emptyState');
    let autoScroll = true;

    function renderLogs(logs) {
      if (!logs || logs.length === 0) {
        container.innerHTML = '<div class="empty-state" id="emptyState">No logs yet.</div>';
        return;
      }
      emptyState?.remove();
      container.innerHTML = '';
      for (const line of logs) {
        const div = document.createElement('div');
        div.className = 'log-entry';
        div.textContent = line;
        container.appendChild(div);
      }
    }

    function onLogsUpdate(logs) {
      renderLogs(logs);
      if (autoScroll) {
        container.scrollTop = container.scrollHeight;
      }
    }

    // Listen for log updates from Bun via bun bridge
    window.__electrobunBunBridge?.postMessage(JSON.stringify({ type: 'request-logs' }));

    window.addEventListener('message', (e) => {
      try {
        const data = typeof e.data === 'string' ? JSON.parse(e.data) : e.data;
        if (data.type === 'logs-update') {
          onLogsUpdate(data.logs);
        }
      } catch {}
    });

    // Track scroll position — disable auto-scroll when user scrolls up
    container.addEventListener('scroll', () => {
      const threshold = 30;
      autoScroll = (container.scrollHeight - container.scrollTop - container.clientHeight) < threshold;
    });

    // Clear button
    document.getElementById('clearBtn').addEventListener('click', () => {
      window.__electrobunBunBridge?.postMessage(JSON.stringify({ type: 'clear-logs' }));
      renderLogs([]);
    });
  </script>
</body>
</html>
